<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>João Arthur</title>

  <!-- Mesma linguagem dos cards do site: quadrado de canto arredondado,
       fundo quase preto (#141414) e borda branca bem sutil. -->
  <rect width="64" height="64" rx="16" fill="#141414"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Iniciais. Favicon é lido a 16px na aba, então o desenho precisa
       aguentar a redução: duas letras grossas, bem centradas, com bastante
       contraste. Qualquer coisa mais detalhada virava borrão nesse tamanho.
       A pilha de fontes cai no sans-serif do sistema — favicon não carrega
       webfont. -->
  <text x="32" y="33"
        text-anchor="middle" dominant-baseline="central"
        font-family="Outfit, Geist, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="-1.2"
        fill="#ffffff">JA</text>
</svg>
